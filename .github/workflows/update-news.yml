name: Update news

on:
  schedule:
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-news.mjs --check
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Read,Write,WebSearch,WebFetch"'
          prompt: |
            You maintain the news feed of a Grand Theft Auto VI companion app. Do not edit any existing file or run git.

            1. Read news.json to see the stories the app already has.
            2. Fetch Rockstar's official YouTube feed for new videos:
               https://www.youtube.com/feeds/videos.xml?channel_id=UC6VcWc1rAoWdBCM0JxrRQ3A
            3. Search the web for GTA VI news from the past 7 days. Only use rockstargames.com, ign.com, gamespot.com,
               eurogamer.net, polygon.com, theverge.com, kotaku.com, pcgamer.com, gamesindustry.biz or bloomberg.com.

            Rules:
            - Only news confirmed by Rockstar Games/Take-Two, or reported by one of those outlets citing them. No rumors or speculation.
            - Skip anything news.json already covers, even under a different headline.
            - Write original text; do not copy article sentences.
            - At most 5 entries.

            Write fresh.json in the repo root: a JSON array (write [] if nothing is new). Each item:
            {"title","type","date","summary","content","source","url"}
            type is one of announcement, trailer, update, leak. date like "October 15, 2026".
            summary is one sentence, content is 2-4 sentences, source is the outlet name, url is the source article.
      - run: node scripts/update-news.mjs fresh.json && rm -f fresh.json
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: news/auto
          add-paths: news.json
          title: 'News update'
          commit-message: 'chore: news update'
          body: 'Automated news update. Check sources before merging; merged changes reach the app within minutes.'
